services:
  - type: web
    name: forestcare-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 2 --timeout 180 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: FRONTEND_URL
        fromService:
          type: web
          name: forestcare-ai-frontend
          property: host

  - type: static
    name: forestcare-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://forestcare-ai-backend.onrender.com/api
